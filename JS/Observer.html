<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lazy Loading Images using Intersection Observer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
}

h1{
    text-align:center;
    padding:30px;
    background:#222;
    color:white;
}

.container{
    width:80%;
    margin:auto;
}

.image{
    width:100%;
    height:450px;
    object-fit:cover;
    margin:120px 0;
    border-radius:10px;
    opacity:0;
    transform:translateY(40px);
    transition:all .8s ease;
}

.image.loaded{
    opacity:1;
    transform:translateY(0);
}
</style>

</head>
<body>

<h1>Intersection Observer API (Lazy Loading)</h1>

<div class="container">

<img
class="image"
src="https://via.placeholder.com/600x400?text=Loading..."
data-src="https://picsum.photos/id/1015/900/500"
alt="Image 1">

<img
class="image"
src="https://via.placeholder.com/600x400?text=Loading..."
data-src="https://picsum.photos/id/1016/900/500"
alt="Image 2">

<img
class="image"
src="https://via.placeholder.com/600x400?text=Loading..."
data-src="https://picsum.photos/id/1018/900/500"
alt="Image 3">

<img
class="image"
src="https://via.placeholder.com/600x400?text=Loading..."
data-src="https://picsum.photos/id/1020/900/500"
alt="Image 4">

<img
class="image"
src="https://via.placeholder.com/600x400?text=Loading..."
data-src="https://picsum.photos/id/1024/900/500"
alt="Image 5">

<img
class="image"
src="https://via.placeholder.com/600x400?text=Loading..."
data-src="https://picsum.photos/id/1035/900/500"
alt="Image 6">

</div>

<script>

const images = document.querySelectorAll(".image");

const observer = new IntersectionObserver((entries, observer)=>{
    entries.forEach((entry)=>{
        if(entry.isIntersecting){
            const img = entry.target;
            console.log(img.alt + " is visible");
            img.src = img.dataset.src;
            img.onload = () =>{img.classList.add("loaded");}
            observer.unobserve(img);
        }
    });
},{root:null,threshold:0.2});
images.forEach((img)=>{observer.observe(img);});
</script>

</body>
</html>
